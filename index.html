<script>/* pot-motor.js · v1.1 (basamento + torre) · UMBRAL Lab 2 · motor compartido Calculadora POT + Modelo 3D
   Reglas: Ficha normativa POT (COM-030-08 con reformas; COM-48-2024 por verificar). */
(function(root){
// V14: parámetros verificados contra el reglamento POT (arts. 42-47, 47 Bis). Ver Ficha normativa POT.
const POT = {
  G1:{ie:1.2, ie_a:1.8,  ie_max:null, alt:16,  alt_a:24,  alt_max:null, perm:.70,bs:8, sepBS:3,fDCT:20,aDCT:1000,nom:'Rural'},
  G2:{ie:1.8, ie_a:2.7,  ie_max:null, alt:16,  alt_a:24,  alt_max:null, perm:.40,bs:8, sepBS:3,fDCT:8, aDCT:120, nom:'Semiurbana'},
  G3:{ie:2.7, ie_a:4.0,  ie_max:null, alt:16,  alt_a:24,  alt_max:null, perm:.10,bs:12,sepBS:3,fDCT:3, aDCT:60,  nom:'Urbana'},
  G4:{ie:4.0, ie_a:6.0,  ie_max:9.0,  alt:32,  alt_a:48,  alt_max:96,   perm:.00,bs:16,sepBS:4,fDCT:15,aDCT:450, nom:'Central'}, // Confirmado: POT COM-030-08 art. 46 (texto con reformas 2011-2013)
  G5:{ie:6.0, ie_a:9.0,  ie_max:11.0, alt:64,  alt_a:96,  alt_max:128,  perm:.00,bs:16,sepBS:5,fDCT:21,aDCT:600, nom:'Núcleo'} // ie/alt base y ampliado confirmados (art. 47). ie_max 11.0 / alt_max 128 según COM-48-2024 — PENDIENTE verificar texto oficial
};

const LAB1_VENTA = {
  z01:1771,z02:1935,z04:2601,z05:2705,z06:1394,z07:1695,z09:2040,
  z10:2778,z11:2292,z12:2055,z13:2473,z14:2533,z15:2840,z16:2079,z17:1630,z18:1055,
  z21:1191
};

const IVA_TASA = 0.12; // IVA Guatemala (SAT) — primera venta de inmueble nuevo


// Supuestos del desarrollador (prefijo 'p' = Pro, 't' = Tasador)

// Parámetros según escenario
function paramsEscenario(zonaG, esc){
  const g=POT[zonaG];
  const esMax = esc==='max' && (zonaG==='G4'||zonaG==='G5') && !!g.ie_max;
  const esMedio = esc==='max' && !esMax;
  return {g, esMax, esMedio,
    ie:  esMax?g.ie_max : esMedio?g.ie_a : g.ie,
    alt: esMax?g.alt_max: esMedio?g.alt_a: g.alt};
}

// Estacionamientos: mínimo normativo vs. diseño elegido por el usuario.
// Cada componente nunca queda por debajo de la norma.
// Visitas según Anexo I del COM-03-2009: por m² residenciales totales, no por unidad.
// (Límites intermedios 1,500/3,000/4,500 m²: verificar con el texto oficial.)
function visitasNorma(m2R){
  if(m2R<500) return 0;
  if(m2R<=1500) return 3;
  if(m2R<=3000) return 4;
  if(m2R<=4500) return 6;
  return Math.ceil(m2R/800);
}

function estacionamientos(o){
  const esZonaAlta = o.zonaG==='G3'||o.zonaG==='G4'||o.zonaG==='G5';
  // COM-03-2009 (ratios trabajados en versiones anteriores) · VERIFICAR vigencia con COM-29-2025
  const normRes = esZonaAlta ? Math.ceil(o.m2R/300) : Math.ceil(o.m2R/100);
  const normVis = visitasNorma(o.m2R);
  const am = o.am>0 ? Math.ceil(o.am/75) : 0; // COM-29-2025: 1 c/75 m² áreas sociales
  const disRes = Math.ceil(o.nu*o.plazasU);
  const disVis = (o.visitas!=null && o.visitas>=0) ? o.visitas : normVis;
  const res = Math.max(normRes, disRes);
  const vis = Math.max(normVis, disVis);
  return {normRes, normVis, am, norma:normRes+normVis+am,
          disRes, disVis, res, vis, total:res+vis+am};
}

// Sótano por plazas × m²/plaza. Nunca ocupa el área permeable mínima.
function calcSotanoV10(o){
  const permMin = o.area*o.perm;
  const areaNivelMax = o.area*(1-o.perm);
  const areaLibre = o.permiteSup ? Math.max(0, o.area - o.huella - permMin) : 0;
  const sup = Math.floor(areaLibre/o.m2Plaza);
  const avisos=[];
  if(o.ancho>0 && o.largo>0 && Math.min(o.ancho,o.largo)<15) avisos.push('angosto');

  if(o.nivDecl>0){ // sótano declarado por el usuario
    const aDecl = o.areaDecl>0 ? o.areaDecl : areaNivelMax;
    const excedePerm = aDecl > areaNivelMax + 0.5;
    const aN = Math.min(aDecl, areaNivelMax);
    const plazasSot = o.nivDecl*Math.floor(aN/o.m2Plaza);
    const plazasSup = Math.min(sup, Math.max(0,o.plazas-plazasSot));
    return {modo:'declarado', niveles:o.nivDecl, areaNivel:aN, m2Sot:aN*o.nivDecl,
            plazasSot, plazasSup, capacidad:plazasSot+sup,
            suficiente:plazasSot+sup>=o.plazas, excedePerm, avisos};
  }
  if(sup>=o.plazas){
    return {modo:'superficie', niveles:0, m2Sot:0, plazasSot:0, plazasSup:o.plazas,
            capacidad:sup, suficiente:true, excedePerm:false, avisos};
  }
  const plazasSot = o.plazas - sup;
  const porNivel = Math.floor(areaNivelMax/o.m2Plaza);
  if(porNivel<1){
    return {modo:'inviable', niveles:0, m2Sot:0, plazasSot:0, plazasSup:sup,
            capacidad:sup, suficiente:false, excedePerm:false, avisos};
  }
  const niveles = Math.ceil(plazasSot/porNivel);
  if(niveles>4) avisos.push('muchos_niveles');
  return {modo:'auto', niveles, areaNivel:areaNivelMax, porNivel,
          m2Sot:plazasSot*o.m2Plaza, plazasSot, plazasSup:sup,
          capacidad:sup+niveles*porNivel, suficiente:true, excedePerm:false, avisos};
}

// Costos completos sin terreno (incluye costos del desarrollador)
function costosProyecto(o){
  const obraSup = o.m2T*o.cm2;
  const obraSot = o.sot.m2Sot*o.cSot;
  const obra = obraSup+obraSot;
  const cDi = obra*o.di/100, cAd = obra*o.ad/100, cIns = obra*o.ins/100;
  const cImp = obra*o.dev.imp/100;
  const cUrb = o.area*18;
  const licE = Math.round(o.m2T*2.5*({G1:.8,G2:.9,G3:1,G4:1.2,G5:1.4}[o.zonaG]||1));
  const m2Inc = o.esMax ? Math.max(0, o.m2T - o.area*POT[o.zonaG].ie) : 0;
  const cCau = Math.round(m2Inc*o.cm2*0.05);
  const cCom = o.ventas*o.dev.com/100;
  const baseFin = obra+cDi+cAd+cIns+cImp+cUrb+licE+cCau;
  // Saldo promedio ~50% durante el plazo (desembolso progresivo). El terreno se asume con capital propio.
  const cFin = baseFin*(o.dev.finPct/100)*(o.dev.finTasa/100)*(o.dev.finMeses/12)*0.5;
  let ivaDeb=0, ivaCred=0, cIva=0;
  if(o.dev.iva==='si' && o.ventas>0){
    ivaDeb  = o.ventas*IVA_TASA/(1+IVA_TASA);                    // IVA incluido en el precio de venta
    ivaCred = (obra+cDi+cAd+cIns+cImp+cCom)*IVA_TASA/(1+IVA_TASA); // crédito fiscal de costos facturados
    cIva = Math.max(0, ivaDeb-ivaCred);
  }
  const total = baseFin+cCom+cFin+cIva;
  return {obraSup, obraSot, obra, cDi, cAd, cIns, cImp, cUrb, licE, cCau, m2Inc,
          cCom, cFin, ivaDeb, ivaCred, cIva, total};
}

// Programa automático: respeta IE del escenario Y la altura
function programaAuto(zonaG, area, tipoU, esc, altPT, ci){
  const p = paramsEscenario(zonaG, esc);
  const nMax = Math.max(1, Math.floor(p.alt/altPT));
  const huellaMax = area*(1-p.g.perm)*0.90;
  const m2TporIE = area*p.ie;
  const m2TporAlt = huellaMax*nMax;
  const limitaAltura = m2TporAlt < m2TporIE;
  const m2Tmax = Math.min(m2TporIE, m2TporAlt);
  const unidades = Math.floor(m2Tmax/(1+ci)/tipoU); // 0 = no cabe ni una unidad
  const m2R = unidades*tipoU, m2T = m2R*(1+ci);
  const niveles = Math.ceil(m2T/Math.max(huellaMax,1));
  return {p, unidades, m2R, m2T, niveles, nMax, huellaMax, limitaAltura};
}

// Proyecto completo (lo usan Pro y Tasador)
function evaluarProyecto(o){
  // o: zonaG, esc, area, ancho, largo, nu, au, ci, cm2, di, ad, ins, altPT, am,
  //    plazasU, visitas, m2Plaza, cSot, nivDecl, areaDecl, pv, dev
  const P = paramsEscenario(o.zonaG, o.esc);
  const g = P.g;
  const m2R = o.nu*o.au;
  const m2T = m2R*(1+o.ci/100);
  const m2E = o.area*P.ie;
  const nMax = Math.max(1, Math.floor(P.alt/o.altPT));
  const huellaMax = o.area*(1-g.perm);
  const huella = m2T/nMax;

function Lote(){ this.geo = {}; this.lin = {}; }
Lote.prototype.caja = function(x,y,z,w,h,d,color,linea){
  const g0 = new THREE.BoxGeometry(w,h,d); g0.translate(x,y+h/2,z); const g = g0.toNonIndexed(); g0.dispose(); g.deleteAttribute('uv');
  const k = new THREE.Color(color).getHexString(); (this.geo[k] = this.geo[k] || []).push(g);
  if(linea) this.rect(x,y,z,w,d,linea,true,h);
};
Lote.prototype.rect = function(x,y,z,w,d,linea,caja,h){
  const k = linea.join(','), a = this.lin[k] = this.lin[k] || [], X0=x-w/2, X1=x+w/2, Z0=z-d/2, Z1=z+d/2;
  const anillo = yy => [X0,yy,Z0, X1,yy,Z0, X1,yy,Z0, X1,yy,Z1, X1,yy,Z1, X0,yy,Z1, X0,yy,Z1, X0,yy,Z0];
  a.push(...anillo(y));
  if(caja){ a.push(...anillo(y+h)); [[X0,Z0],[X1,Z0],[X1,Z1],[X0,Z1]].forEach(([px,pz]) => a.push(px,y,pz,px,y+h,pz)); }
};
Lote.prototype.forma = function(f, x, y, z, h, color, linea){
  const {out, h:hole} = contorno(f), sh = new THREE.Shape();
  out.forEach(([px,py],k) => k ? sh.lineTo(px,-py) : sh.moveTo(px,-py));
  if(hole){ const ph = new THREE.Path(); hole.slice().reverse().forEach(([px,py],k) => k ? ph.lineTo(px,-py) : ph.moveTo(px,-py)); sh.holes.push(ph); }
  const g = new THREE.ExtrudeGeometry(sh, {depth:h, bevelEnabled:false}); g.rotateX(-Math.PI/2); g.translate(x,y,z);
  const geo = g.index ? g.toNonIndexed() : g; geo.deleteAttribute('uv');
  const k = new THREE.Color(color).getHexString(); (this.geo[k] = this.geo[k] || []).push(geo);
  if(linea){ const e = new THREE.EdgesGeometry(g, 30), lk = linea.join(','); (this.lin[lk] = this.lin[lk] || []).push(...e.attributes.position.array); e.dispose(); }
};
Lote.prototype.anillo = function(f, x, y, z, linea){
  const {out, h} = contorno(f), lk = linea.join(','), a = this.lin[lk] = this.lin[lk] || [];
  [out, h].forEach(ring => { if(!ring) return; ring.forEach((p,k) => { const q = ring[(k+1)%ring.length]; a.push(x+p[0],y,z+p[1], x+q[0],y,z+q[1]); }); });
};
Lote.prototype.armar = function(grupo){

  Object.entries(this.lin).forEach(([k,pos]) => { const [c,w] = k.split(','); const lg = new THREE.LineSegmentsGeometry().setPositions(pos);
    const lm = new THREE.LineMaterial({color:+c, linewidth:+w, resolution:res}); lineMats.push(lm); grupo.add(new THREE.LineSegments2(lg, lm)); });
};

function construirEdificios(){

  edif = new THREE.Group(); scene.add(edif);
  const L = new Lote(), capa = S.capa;
  lotes.forEach(l => {
    const z = zonaBloque(l.i, l.j); if(z==='PARQUE') return;
    const g = POT[z], col = ZC[z];
    const centro = (l.i===2 || l.i===3) && !(l.j===2 || l.j===3);
    const resaltar = capa==='zonas' && S.verCentro && centro;
    const potencial = (capa!=='hoy' && capa!=='zonas') || resaltar;
    // Suelo del lote
    if(capa==='hoy') L.caja(l.x,0,l.z,LW-1,0.2,LD-1,0xfafaf8,[0xd0d0cc,1]);
    else if(capa==='perm') L.caja(l.x,0,l.z,LW-1,0.2,LD-1,0xcfe0c2,[0xa9bd9c,1]);
    else L.caja(l.x,0,l.z,LW-1,0.2,LD-1,tint(col,.45),resaltar?[AZUL,2.6]:[0x0a0a0a,1]);
    if(!potencial){
      // Ciudad de hoy: alturas variadas, huella irregular, tanques en azoteas. Con color de zona desde el paso 2.
      let pisos = l.r<.55 ? 1+Math.floor(l.r2*2) : l.r<.85 ? 2+Math.floor(l.r2*3) : l.r<.96 ? 5+Math.floor(l.r2*5) : 10+Math.floor(l.r2*6);
      if(z==='G2') pisos = Math.min(pisos,3);

      L.caja(l.x,0.2,l.z,w,h,d,capa==='hoy'?0xffffff:tint(col,.16),[0x8a8a86,1]);
      for(let p=1;p<pisos;p++) L.rect(l.x,0.2+p*3,l.z,w,d,[capa==='hoy'?0xcfcfcb:tint(col,.45).getHex(),1]);

    const v = volLote(l, z, esc);
    if(capa==='perm'){ const lote = R(-LW/2+.5, LW/2-.5, -LD/2+.5, LD/2-.5), Fc = g.perm>0 ? inHastaArea(lote, aR(lote)*(1-g.perm)) : lote;

    grupos.forEach(G => {
      const c = G.inc ? tint(AZUL,.22) : (capa==='perm' ? 0xffffff : tint(col,.24));
      L.forma(G.f, l.x, 0.2+G.z0+0.02, l.z, G.z1-G.z0-0.04, c, G.inc ? [AZUL,1.4] : [0x0a0a0a,1.25]);
      G.n.slice(1).forEach(n => L.anillo(G.f, l.x, 0.2+n.z0, l.z, G.inc ? [0xa9bdf0,1] : [capa==='perm'?0xcfcfcb:tint(col,.6).getHex(),1]));

    ['Este edificio', NOMBRE_FORMA[vb.forma] + ' · ' + vb.niv.length + ' niveles · ' + vb.alt + ' m']
  ].map(([k,v]) => `<div class="f"><span>${k}</span><b>${v}</b></div>`).join('') + '<a href="https://mapa-pot.umbralgt.com">Ver la zona de tu terreno en el mapa →</a>';
  $('#ficha').style.display = 'block';
}
$('#ficha .x').onclick = () => { $('#ficha').style.display='none'; };

// ═══ Etiquetas con línea guía ═══
let etqs = [];
function dibujarEtiquetas(){
  const t = $('#tags'), svg = $('#guias'); t.innerHTML=''; svg.innerHTML='';
  const w = vista.clientWidth, h = vista.clientHeight, k = w<560 ? .5 : 1;
  etqs.forEach(([txt,p,dx,dy,c]) => {
    const v = new THREE.Vector3(...p).project(cam); if(v.z>1 || Math.abs(v.x)>1.05 || Math.abs(v.y)>1.05) return;
    const px=(v.x+1)/2*w, py=(-v.y+1)/2*h, d=document.createElement('div'); d.className='tag '+(c||''); d.textContent=txt; t.appendChild(d);
    const hw=d.offsetWidth/2+6, lx=Math.min(w-hw,Math.max(hw,px+dx*k)), ly=Math.min(h-20,Math.max(20,py+dy*k)); d.style.left=lx+'px'; d.style.top=ly+'px';
    const col = c==='acc' ? '#2f5bd3' : '#0a0a0a';
    svg.insertAdjacentHTML('beforeend', `<line x1="${px}" y1="${py}" x2="${lx}" y2="${ly}" stroke="${col}" stroke-width="1"/><circle cx="${px}" cy="${py}" r="3" fill="${col}"/>`);
  });
}

// ═══ Recorrido ═══
const ficha = z => { const g = POT[z]; return `<tr><td><span class="dot" style="background:${hexCss(ZC[z])}"></span>${z}</td><td>${g.ie}</td><td>${g.alt} m</td><td>${g.bs} m · ${g.sepBS} m</td><td>${Math.round(g.perm*100)}%</td></tr>`; };
// Terreno de ejemplo para anclar etiquetas (zona y forma dadas, cerca del centro)
function loteEjemplo(zona, forma){
  const c = lotes.filter(l => zonaBloque(l.i,l.j)===zona && volLote(l,zona,'base').forma===forma);
  c.sort((p,q) => Math.hypot(p.x-60,p.z-60) - Math.hypot(q.x-60,q.z-60)); return c[0];
}
const PASOS = [
  {capa:'hoy', cam:{x:0,z:-20,fr:300}, t:'La ciudad sin reglas claras',
   p:`<p>Casas de un piso junto a edificios de doce, cada terreno resolviendo por su cuenta. Así creció buena parte de la ciudad.</p><p>El <strong>Plan de Ordenamiento Territorial (POT)</strong> ordena ese crecimiento: define cuánto y cómo se puede construir en cada terreno de la Ciudad de Guatemala.</p>`,
   etq:()=>[['Avenida',[180,0,0],0,-70],['Parque',[-240,0,245],60,-50],['Barranco',[120,-20,-345],60,40]]},
  {capa:'zonas', centro:true, cam:{x:20,z:150,fr:170}, t:'El ancho de la calle decide la zona',
   p:`<p>Cada terreno recibe una zona, de <strong>G0</strong> (no se construye) a <strong>G5</strong> (la más densa). Junto a las vías más anchas se permite construir más, porque tienen capacidad para más personas y transporte.</p><p>Las manzanas resaltadas en azul están junto a la <strong>vía central</strong> y muestran cuánto podrían construir. <strong>Cambiá el ancho de la vía</strong> y mirá cómo cambian su zona y sus edificios.</p>`,
   ctrl:'via', etq:()=>[['Vía central · ' + TV[S.tCentro].m + ' m',[0,0,240],70,-40,'neg'],['Zona ' + TV[S.tCentro].zona + ' junto a la vía',[60,10,150],140,-60,'acc']]},
  {capa:'zonas', cam:{x:80,z:-190,fr:210,az:3.86,el:.55}, t:'La distancia y la pendiente también cuentan',
   p:`<p>Un terreno a menos de <strong>560 metros recorridos</strong> de una vía colectora (tipo T0 o T2) es <strong>G3</strong>. Más lejos pasa a <strong>G2</strong>: se permite construir menos y hay que dejar más suelo natural.</p><p>Las pendientes también tienen zona: de 20° a 40° es <strong>G1</strong>, y más de 40° es <strong>G0</strong>, donde no se permite ocupación humana. <strong>Tocá la ladera o el barranco</strong> para ver por qué.</p><p class="nota">En esta ciudad de ejemplo, las manzanas del borde representan terrenos lejanos.</p>`,
   etq:()=>[['G3 · cerca de la vía T2',[150,0,-155],-40,-70],['G2 · lejos de vías principales',[240,0,-245],40,-60],['G1 · ladera',[40,-6,-315],-80,50],['G0 · barranco',[-60,-26,-352],-80,40]]},
  {capa:'indice', cam:{x:30,z:0,fr:250}, t:'Cuánto se puede construir',
   p:`<p>Cada zona tiene un <strong>índice de edificabilidad</strong>: cuántas veces el área del terreno se puede construir, sumando todos los pisos. En G3 es 2.7 veces; en G5, 6 veces.</p><p>Así se vería esta ciudad si cada terreno construyera lo que la norma permite sin trámites especiales. Fijate que <strong>en una misma zona los edificios tienen formas distintas</strong> (bloque, en L, con patio o torre): usan los mismos metros, pero cada forma da un edificio diferente.</p><p><strong>Tocá cualquier terreno</strong> para ver sus números.</p>`,
   tabla:true, etq:()=>[['G5 · 6 veces el terreno',[150,20,50],80,-70],['G4 · 4 veces',[60,12,155],100,-50],['G3 · 2.7 veces',[150,8,155],90,-30],['G2 · 1.8 veces',[240,4,-245],30,-60]]},
  {capa:'altura', cam:{x:60,z:60,fr:110, el:.42}, t:'Qué tan alto, y cómo',
   p:`<p>Hasta cierta altura el edificio puede <strong>pegarse a los vecinos</strong>: es el bloque inferior. Más arriba debe <strong>separarse de todos los bordes</strong>, también de la calle: es el bloque superior. Por eso los pisos altos son más chicos.</p><p>Una <strong>torre sobre basamento</strong> lleva esa idea al extremo: un basamento bajo pegado a los vecinos y una torre delgada que sube más.</p>`,
   tablaAlt:true, etq:()=>{ const b = loteEjemplo('G5','bloque'), t = loteEjemplo('G5','torre'), L = [];
     if(b){ const v = volLote(b,'G5','base'); L.push(['Bloque inferior · pegado',[b.x-LW/2,6,b.z],-210,40],['Bloque superior · se separa',[b.x,v.alt-1,b.z],-180,-70]); }
     if(t){ const v = volLote(t,'G5','base'); L.push(['Torre sobre basamento · ' + v.alt + ' m',[t.x,v.alt,t.z],150,-60]); }
     return L; }},
  {capa:'perm', cam:{x:170,z:-150,fr:170}, t:'El suelo que respira',
   p:`<p>Parte de cada terreno debe quedar como <strong>tierra natural</strong>, sin construcción ni sótano, para que el agua de lluvia se filtre y no inunde la calle.</p><p>En G2 es el 40% del terreno; en G3, el 10%. En G4 y G5 no se exige.</p>`,
   etq:()=>[['G2 · 40% natural',[240,2,-245],30,-70],['G3 · 10% natural',[150,2,-155],-60,-80]]},
  {capa:'incent', cam:{x:40,z:20,fr:200}, t:'Con incentivos se puede más',
   p:`<p>La Municipalidad permite construir más metros y más alto si el proyecto cumple las <strong>prácticas incentivables</strong> y hace las aportaciones urbanísticas que define el reglamento de incentivos. A cambio, el desarrollador contrata un seguro de caución.</p><p>Los pisos <strong style="color:#2f5bd3">azules</strong> son los que solo existen con incentivos.</p>`,
   ctrl:'incent', etq:()=>[['Pisos con incentivos',[150,35,50],90,-80,'acc']]},
  {capa:'incent', cam:{x:0,z:-20,fr:300}, t:'¿Y tu terreno?', fin:true,
   p:`<p>Todo esto aplica a cada terreno de la ciudad. Buscá el tuyo en el mapa, calculá cuánto vale y miralo en 3D.</p>`,
   etq:()=>[]}
];
function pintarPaso(){
  const P = PASOS[S.paso];
  S.capa = P.capa; S.verCentro = !!P.centro; construirEdificios();
  Object.assign(obj, {x:0,z:0,fr:230,az:.72,el:.62}, P.cam);
  $('#p-n').textContent = P.fin ? 'Cierre' : 'Paso ' + (S.paso+1) + ' de ' + (PASOS.length-1);
  $('#puntos').innerHTML = PASOS.slice(0,-1).map((_,k) => `<i class="${k<=S.paso?'on':''}"></i>`).join('');
  $('#eyebrow').textContent = P.fin ? 'Siguiente paso' : 'Plan de Ordenamiento Territorial';
  $('#titulo').textContent = P.t; $('#texto').innerHTML = P.p;
  let c = '';
  if(P.ctrl==='via') c = `<div class="control"><span class="mini-t">Tipo de vía central (ancho de ejemplo)</span><div class="seg" id="seg-via">${Object.entries(TV).map(([k,v])=>`<button data-via="${k}" class="${k===S.tCentro?'sel':''}">${k}<br><small style="font-weight:500">${v.m} m</small></button>`).join('')}</div><div class="exp" id="exp-via"></div></div>`;
  if(P.ctrl==='incent') c = `<div class="control"><span class="mini-t">Mostrar</span><div class="seg"><button data-inc="0" class="${!S.incent?'sel':''}">Sin incentivos</button><button data-inc="1" class="${S.incent?'sel':''}">Con incentivos</button></div></div>`;
  if(P.tabla || P.tablaAlt) c += `<table class="z"><thead><tr><th>Zona</th><th>Índice</th><th>Altura</th><th>Pegado · separa</th><th>Natural</th></tr></thead><tbody>${['G2','G3','G4','G5'].map(ficha).join('')}</tbody></table>`;
  if(P.fin) c = `<a class="cta pri" href="https://mapa-pot.umbralgt.com">Buscar mi terreno en el mapa <span>→</span></a>
    <a class="cta" href="https://calculadora-pot.umbralgt.com">Calcular cuánto vale <span>→</span></a>
    <a class="cta" href="https://terreno3d.umbralgt.com">Verlo en 3D <span>→</span></a>
    <p class="nota" style="margin-top:6px"><strong>La norma dice cuánto se puede construir, no cómo hacerlo bien.</strong> Convertir lo que permite el POT en un buen proyecto es el trabajo de un arquitecto: antes de comprar, vender o diseñar, consultá con un profesional colegiado.</p>
    <p class="nota">Ciudad de ejemplo, esquemática. Reglas: POT de la Ciudad de Guatemala (COM-030-08 y reformas) y reglamento de incentivos COM-48-2024.</p>`;
  $('#ctrl').innerHTML = c;
  $$('[data-via]').forEach(b => b.onclick = () => { S.tAnt = S.tCentro; S.tCentro = b.dataset.via; construirCalles(); construirEdificios(); pintarVia(); etqs = PASOS[S.paso].etq(); $$('[data-via]').forEach(x => x.classList.toggle('sel', x===b)); });
  $$('[data-inc]').forEach(b => b.onclick = () => { S.incent = b.dataset.inc==='1'; construirEdificios(); $$('[data-inc]').forEach(x => x.classList.toggle('sel', x===b)); });
  S.tAnt = null; pintarVia();
  etqs = P.etq();
  $('#atras').disabled = S.paso===0; $('#sig').textContent = P.fin ? 'Volver al inicio' : S.paso===PASOS.length-2 ? 'Terminar' : 'Siguiente';
  $('#ficha').style.display='none';
}
function pintarVia(){ const e = $('#exp-via'); if(!e) return; const t = S.tCentro, z = TV[t].zona, g = POT[z];
  let txt = `Una vía <strong>${t}</strong> de unos ${TV[t].m} m produce <strong>${z}</strong> a su lado: se puede construir <strong>${g.ie} veces el terreno</strong>, hasta ${g.alt} m sin trámites especiales.`;
  if(S.tAnt && S.tAnt !== t){ const za = TV[S.tAnt].zona, ga = POT[za];
    txt = za===z ? `De ${S.tAnt} a ${t}: la vía cambió de ancho, pero la zona sigue siendo <strong>${z}</strong>. ` + txt
      : `De ${S.tAnt} a ${t}: las manzanas resaltadas pasaron de <strong>${za}</strong> a <strong>${z}</strong>. Antes podían construir ${ga.ie} veces su terreno; ahora, <strong>${g.ie} veces</strong>. Mirá cómo ${g.ie>ga.ie?'crecieron':'bajaron'} sus edificios.`; }
  e.innerHTML = txt + (t==='T0'||t==='T2' ? ' La zona G3 se extiende hasta 560 m recorridos.' : ' La zona se extiende hasta 80 m de la vía.'); }
$('#sig').onclick = () => { if(S.libre) salirLibre(); S.paso = PASOS[S.paso].fin ? 0 : S.paso+1; pintarPaso(); };
$('#atras').onclick = () => { if(S.libre) salirLibre(); S.paso = Math.max(0, S.paso-1); pintarPaso(); };

// ═══ Exploración libre ═══
const TXT_CAPA = {hoy:'La ciudad tal como creció, terreno por terreno.', zonas:'Cada terreno con su zona G, según el ancho de las vías y la distancia a ellas.', indice:'Lo que cada terreno puede construir sin trámites especiales. Tocá un terreno para ver sus números.', altura:'Bloque inferior pegado a los vecinos; bloque superior separado de todos los bordes.', perm:'En verde, el suelo natural que cada zona obliga a dejar.', incent:'En azul, los pisos que solo son posibles con incentivos municipales.'};
function entrarLibre(){ S.libre = true; $('#capas').style.display='flex'; ponerCapa(S.capa==='hoy'?'zonas':S.capa);
  $('#p-n').textContent = 'Exploración libre'; $('#puntos').innerHTML=''; $('#libre').style.visibility='hidden'; $('#sig').textContent='Volver al recorrido'; $('#atras').disabled=true; }
function salirLibre(){ S.libre = false; $('#capas').style.display='none'; $('#libre').style.visibility='visible'; }
function ponerCapa(c){ S.capa = c; S.verCentro = c==='zonas'; construirEdificios(); $$('[data-capa]').forEach(b => b.classList.toggle('sel', b.dataset.capa===c));
  $('#titulo').textContent = $(`[data-capa="${c}"]`).textContent; $('#texto').innerHTML = `<p>${TXT_CAPA[c]}</p>`;
  $('#ctrl').innerHTML = c==='zonas' ? `<div class="control"><span class="mini-t">Tipo de vía central</span><div class="seg">${Object.keys(TV).map(k=>`<button data-via="${k}" class="${k===S.tCentro?'sel':''}">${k}</button>`).join('')}</div></div>`
    : c==='incent' ? `<div class="control"><div class="seg"><button data-inc="0" class="${!S.incent?'sel':''}">Sin incentivos</button><button data-inc="1" class="${S.incent?'sel':''}">Con incentivos</button></div></div>` : '';
  $$('[data-via]').forEach(b => b.onclick = () => { S.tCentro = b.dataset.via; construirCalles(); construirEdificios(); $$('[data-via]').forEach(x => x.classList.toggle('sel', x===b)); });
  $$('[data-inc]').forEach(b => b.onclick = () => { S.incent = b.dataset.inc==='1'; construirEdificios(); $$('[data-inc]').forEach(x => x.classList.toggle('sel', x===b)); });
  etqs = []; }
$('#libre').onclick = entrarLibre;
$$('[data-capa]').forEach(b => b.onclick = () => ponerCapa(b.dataset.capa));

// ═══ Bucle de dibujo ═══
let t0 = performance.now();
function bucle(t){
  const dt = Math.min(.05, (t-t0)/1000); t0 = t;
  ['x','z','fr','az','el'].forEach(k => { cst[k] += (obj[k]-cst[k])*Math.min(1, dt*4); });
  if(!reduce && !document.hidden) moverTransito(dt);
  aplicarCam(); r.render(scene, cam); dibujarEtiquetas();
  requestAnimationFrame(bucle);
}
construirBase(); construirCalles(); construirTransito(); tamano(); pintarPaso();
window.__E = S;
requestAnimationFrame(bucle);
})();
</script>
</body>
</html>
